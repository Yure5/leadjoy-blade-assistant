name: Bug 报告
description: 连接、映射、界面或崩溃问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先搜索已有 Issue，并尽量附上日志（`logs\ble.log`、`logs\hiddle.log`），公开前记得给蓝牙地址打码。
  - type: input
    id: version
    attributes:
      label: 程序版本
      description: 标题栏或 设置 → 关于 里显示的版本
      placeholder: V0.8.80
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: Windows 11 23H2 x64
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: 连接方式
      options:
        - 蓝牙 · Blade Plus_1B（XBOX 模式）
        - 蓝牙 · Blade Plus_1B（DS4 模式）
        - 蓝牙 · Blade Plus_1B（Switch 模式）
        - USB 有线
        - 其他手柄（DS4 / DS5 / Xbox / Switch）
        - 未连接
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开程序，连接手柄
        2. 进入按键映射，添加 L4 → F
        3. 按下 L4
        4. 游戏内无反应
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 有截图或录屏请直接粘贴
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 粘贴 `logs\ble.log` / `logs\hiddle.log` 的相关片段
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过已有 Issue，没有重复
          required: true
        - label: 日志中的蓝牙地址 / 设备名已打码
          required: true
