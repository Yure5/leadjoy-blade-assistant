name: 功能建议
description: 想要的新能力或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先说明**使用场景**，再说功能。能用手柄型号和游戏举例最好。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在玩什么、想解决什么问题？
      placeholder: 在 FF14 里想用 L4+方向键快速切职业……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 有没有临时替代方案
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 这个需求与风刃 / 手柄映射相关
          required: true
        - label: 我理解作者可能因为复杂度或风险不实现
          required: true
